# Config file for Goemon's Great Adventure (USA) Recompilation.
# Run from the project root: N64Recomp.exe ga.toml   (symbols: syms/ga.syms.toml, generated by --dump-context from build/ga.elf)

[input]
entrypoint = 0x80000400
output_func_path = "RecompiledFuncs"
relocatable_sections_path = "ga.overlays.txt"
symbols_file_path = "syms/ga.syms.toml"
rom_file_path = "baserom.us.decompressed.z64"
trace_mode = true
bss_section_suffix = "_bss"

[patches]
stubs = [

]

# Nothing ignored any more (2026-10-19): libultra low-level functions are skipped BY NAME (config/symbol_addrs.txt), and the
# direct `jal` into overlays 8/9/10 resolve because those overlays are no longer relocatable (fixed VRAM 0x801738A0, not in
# ga.overlays.txt). See notes/OVERLAYS.md, "Étape 5".
ignored = [
]

# --- Emulated TLB: modules stay at 0x08000000 (ga.overlays.txt is EMPTY: no relocatable section) and the memory macros of
# include/gga_recomp/recomp.h redirect 0x08xxxxxx to the mapped module. See src/game/ga_modules.c and notes/OVERLAYS.md,
# "TLB émulée". The helpers are C functions of the application, declared inside each hook (block-scope declaration).

# file_load(idx, dest) 0x80003E50, entry: register code files with a fixed address (file 6, overlays 8/9/10).
[[patches.hook]]
func = "func_80003E50_4A50"
text = "{ void ga_file_load_begin(uint8_t*, uint32_t, uint32_t); ga_file_load_begin(rdram, (uint32_t)ctx->r4, (uint32_t)ctx->r5); }"
before_vram = 0x80003E50

# module_map 0x80004638, start of its TLB loop (reached only when it really maps): $s0 = file index (0 = raw address),
# $a1 = address & 0x3FFFFFFF, $s4 = last TLB entry written (pages 0..$s4; the pages above keep the previous module).
[[patches.hook]]
func = "func_80004638_5238"
text = "{ void ga_module_mapped(uint8_t*, uint32_t, uint32_t, uint32_t); ga_module_mapped(rdram, (uint32_t)ctx->r16, (uint32_t)ctx->r5, (uint32_t)ctx->r20); }"
before_vram = 0x80004714

# Controller Pak (src/game/ga_pak.cpp): func_80001F24(port) = "init Rumble Pak" (osMotorInit, reimplemented by the runtime: always
# succeeds). The game calls it for the 4 ports at boot and periodically; a success marks the port as Rumble Pak (state 2 at 0x2A4 of
# the port block 0x80080188 + port*0x2BC) and hides the Controller Pak. On hardware osMotorInit fails on a Controller Pak with
# PFS_ERR_DEVICE (0xB): same result here, after the call ($a1 = port block, reloaded at 0x80001F68).
[[patches.hook]]
func = "func_80001F24_2B24"
text = "{ int ga_pak_present(int); if (ga_pak_present((int)(((uint32_t)ctx->r5 - 0x80080188u) / 0x2BCu))) ctx->r2 = 0xB; }"
before_vram = 0x80001F6C

